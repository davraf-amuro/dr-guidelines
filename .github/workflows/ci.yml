name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell-and-json:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          # Parse senza eseguire: intercetta errori di sintassi in tutti gli .ps1 del repo
          $failed = 0
          $files  = Get-ChildItem -Path . -Recurse -Filter '*.ps1' -File |
                    Where-Object { $_.FullName -notmatch '[\/]\.git[\/]' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed++
            }
          }
          if ($failed -gt 0) { exit 1 }
          Write-Host "Parse OK: $(@($files).Count) script."

      - name: Validate JSON files
        shell: pwsh
        run: |
          $failed = 0
          foreach ($path in @('scaffolding-catalog.json', '.mcp.example.json', '.claude/settings.json')) {
            try {
              $null = Get-Content $path -Raw | ConvertFrom-Json -ErrorAction Stop
              Write-Host "JSON OK: $path"
            } catch {
              Write-Host "::error file=$path::JSON non valido: $($_.Exception.Message)"
              $failed++
            }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Codex skills in sync with Claude skills
        shell: pwsh
        run: pwsh ./scripts/sync-codex.ps1 -Check

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect .NET solution/project files
        id: detect_dotnet
        run: |
          if git ls-files "*.sln" "*.csproj" "*.fsproj" "*.vbproj" | grep -q .; then
            echo "has_dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dotnet=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.detect_dotnet.outputs.has_dotnet == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.detect_dotnet.outputs.has_dotnet == 'true'
        run: dotnet restore

      - name: Build
        if: steps.detect_dotnet.outputs.has_dotnet == 'true'
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: steps.detect_dotnet.outputs.has_dotnet == 'true'
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Skip when repository has no .NET solution/project
        if: steps.detect_dotnet.outputs.has_dotnet == 'false'
        run: echo "No .NET solution/project found in repository. Skipping .NET setup, restore, build, and test."

  catalog-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify scaffolding-catalog.json consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # dr-guidelines-install-lib.ps1 al caricamento definisce solo funzioni e variabili: nessun side effect
          . ./dr-guidelines-install-lib.ps1
          $catalog = Get-Content ./scaffolding-catalog.json -Raw | ConvertFrom-Json

          # Il registry si costruisce dal catalogo: precaricato con quello del checkout, altrimenti
          # Get-DrCatalog scaricherebbe il main pubblicato invece del commit in verifica.
          # Get-DrPackageRegistry applica anche l'allowlist dell'owner e fallisce su un repo estraneo.
          $Script:Catalog = $catalog
          $registry = Get-DrPackageRegistry

          $problems = @()

          $catalogNames = @($catalog.packages.name)
          $kindIds      = @($catalog.kinds.id)
          $domainIds    = @($catalog.domains.id)

          foreach ($dup in @($catalogNames | Group-Object | Where-Object { $_.Count -gt 1 })) {
            $problems += "pacchetto duplicato: '$($dup.Name)'"
          }

          # conflictsWith: pacchetti che non vanno installati insieme. Il bersaglio deve esistere
          # e il rapporto deve essere simmetrico (A in conflitto con B implica B in conflitto con A):
          # l'installer avvisa guardando solo il pacchetto che si sta installando.
          foreach ($pkg in $catalog.packages) {
            foreach ($other in @($pkg.conflictsWith | Where-Object { $_ })) {
              $otherPkg = $catalog.packages | Where-Object { $_.name -eq $other } | Select-Object -First 1
              if (-not $otherPkg) {
                $problems += "conflictsWith non risolvibile: '$($pkg.name)' -> '$other'"
                continue
              }
              if ($other -eq $pkg.name) { $problems += "pacchetto '$($pkg.name)': conflictsWith verso se stesso" }
              if (@($otherPkg.conflictsWith) -notcontains $pkg.name) {
                $problems += "conflictsWith non simmetrico: '$($pkg.name)' -> '$other', ma '$other' non cita '$($pkg.name)'"
              }
              if (@($pkg.dependencies) -contains $other) {
                $problems += "pacchetto '$($pkg.name)': '$other' e' sia in dependencies sia in conflictsWith"
              }
            }
          }

          # Pacchetto core: i file che il catalogo dichiara devono esistere in questo repo.
          # rootFiles e coreOnlyArtifacts sono file veri del core; un obsoleteArtifact che esiste ancora
          # e non e' coreOnly verrebbe installato e subito rimosso a ogni -Update.
          foreach ($core in @($catalog.packages | Where-Object { $_.isCore })) {
            foreach ($file in @($core.rootFiles | Where-Object { $_ })) {
              if (-not (Test-Path -LiteralPath $file)) { $problems += "core '$($core.name)': rootFiles '$file' non esiste" }
            }
            foreach ($file in @($core.coreOnlyArtifacts | Where-Object { $_ })) {
              if (-not (Test-Path -LiteralPath $file)) { $problems += "core '$($core.name)': coreOnlyArtifacts '$file' non esiste" }
            }
            foreach ($file in @($core.obsoleteArtifacts | Where-Object { $_ })) {
              if ((Test-Path -LiteralPath $file) -and (@($core.coreOnlyArtifacts) -notcontains $file)) {
                $problems += "core '$($core.name)': obsoleteArtifacts '$file' esiste ancora nel repo e non e' coreOnly"
              }
            }
          }

          foreach ($pkg in $catalog.packages) {
            foreach ($dep in $pkg.dependencies) {
              if ($catalogNames -notcontains $dep) {
                $problems += "dipendenza non risolvibile: '$($pkg.name)' -> '$dep'"
              }
            }
            foreach ($kind in $pkg.appliesTo) {
              if ($kindIds -notcontains $kind) {
                $problems += "pacchetto '$($pkg.name)': appliesTo cita il kind inesistente '$kind'"
              }
            }
          }

          # suggests: rimando non vincolante verso un altro pacchetto. Qui solo integrita' del campo;
          # nessun controllo di appliesTo, perche' un suggerito di kind diverso e' proprio il caso d'uso
          # (dr-fe, node, suggerisce dr-minimalapi, dotnet). Il confronto col testo delle istruzioni
          # sta nel workflow non bloccante suggests-text-check.yml.
          foreach ($pkg in $catalog.packages) {
            $seen = @()
            foreach ($sugg in @($pkg.suggests | Where-Object { $null -ne $_ })) {
              $target = [string]$sugg.package
              if ([string]::IsNullOrWhiteSpace($target)) {
                $problems += "pacchetto '$($pkg.name)': voce suggests senza 'package'"
                continue
              }
              if ($catalogNames -notcontains $target) {
                $problems += "suggests non risolvibile: '$($pkg.name)' -> '$target'"
              }
              if ($target -eq $pkg.name) {
                $problems += "pacchetto '$($pkg.name)': suggests verso se stesso"
              }
              if (@($pkg.dependencies) -contains $target) {
                $problems += "pacchetto '$($pkg.name)': '$target' e' sia in dependencies sia in suggests"
              }
              if ($seen -contains $target) {
                $problems += "pacchetto '$($pkg.name)': suggests duplicato '$target'"
              }
              $seen += $target
              $reason = [string]$sugg.reason
              if ([string]::IsNullOrWhiteSpace($reason)) {
                $problems += "suggests '$($pkg.name)' -> '$target': reason vuoto"
              } elseif ($reason -match '[\x00-\x1F\x7F]') {
                $problems += "suggests '$($pkg.name)' -> '$target': reason con caratteri di controllo (deve stare su una riga)"
              }
            }
          }

          # Compatibilita' delle dipendenze: l'installer non conosce il kind dell'host e installa
          # le dipendenze senza filtrare, quindi una dipendenza incompatibile va fermata qui.
          # Regola: D, dipendenza di P, e' compatibile se D.appliesTo contiene 'any' oppure
          # contiene ogni kind di P.appliesTo. Un pacchetto 'any' puo' dipendere solo da pacchetti 'any'.
          foreach ($pkg in $catalog.packages) {
            $pkgKinds = @($pkg.appliesTo | Where-Object { $_ })
            foreach ($dep in $pkg.dependencies) {
              $depPkg = $catalog.packages | Where-Object { $_.name -eq $dep } | Select-Object -First 1
              if (-not $depPkg) { continue }
              $depKinds = @($depPkg.appliesTo | Where-Object { $_ })
              if ($depKinds -contains 'any') { continue }
              $uncovered = @($pkgKinds | Where-Object { $depKinds -notcontains $_ })
              if ($uncovered.Count -gt 0) {
                $problems += "dipendenza incompatibile: '$($pkg.name)' ($($pkgKinds -join ',')) -> '$dep' ($($depKinds -join ',')): kind non coperti '$($uncovered -join ',')'"
              }
            }
          }

          # Cicli: stessa visita dell'installer, che su un ciclo lancia un errore invece di andare in loop.
          # Manifest vuoto: il grafo si visita tutto, come in un host senza pacchetti.
          $emptyManifest = [PSCustomObject]@{ installed = @() }
          $graphErrors = @()
          foreach ($pkg in $catalog.packages) {
            try {
              $null = Resolve-DrDependencyTree -PackageName $pkg.name -Registry $registry -Manifest $emptyManifest
            } catch {
              $graphErrors += $_.Exception.Message
            }
          }
          $problems += @($graphErrors | Where-Object { $_ -like 'Ciclo*' } | Select-Object -Unique)

          foreach ($domain in $catalog.domains) {
            if ($kindIds -notcontains $domain.kind) {
              $problems += "dominio '$($domain.id)': kind inesistente '$($domain.kind)'"
            }
            foreach ($ref in $domain.packages) {
              if ($catalogNames -notcontains $ref) {
                $problems += "dominio '$($domain.id)' cita il pacchetto inesistente '$ref'"
              }
            }
          }

          foreach ($intent in $catalog.intentMap) {
            if ($domainIds -notcontains $intent.domain) {
              $problems += "intentMap punta al dominio inesistente '$($intent.domain)'"
            }
          }

          $typeIds = @()
          foreach ($type in $catalog.projectTypes) {
            if ($typeIds -contains $type.id) { $problems += "tipologia duplicata: '$($type.id)'" }
            $typeIds += $type.id

            if (-not $type.dotnetTemplate -and -not $type.nodeScaffolder) {
              $problems += "tipologia '$($type.id)' senza dotnetTemplate ne' nodeScaffolder"
            }

            foreach ($ref in @($type.suggestedPackages) + @($type.optionalPackages)) {
              if ($ref -and $catalogNames -notcontains $ref) {
                $problems += "tipologia '$($type.id)' cita il pacchetto inesistente '$ref'"
              }
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host "Catalogo NON allineato:" -ForegroundColor Red
            $problems | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

          Write-Host "Catalogo allineato: $($catalogNames.Count) pacchetti, $($typeIds.Count) tipologie."
